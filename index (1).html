<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Interactive Web Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 60px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
      color: #111111;
      transition: background 0.3s, color 0.3s;
    }

    h1 {
      margin-bottom: 32px;
      font-size: 28px;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card {
      width: 200px;
      min-height: 160px;
      padding: 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      background: #ffffff;
      color: #111111;
    }

    .card h2 {
      font-size: 20px;
      margin: 16px 0;
    }

    button {
      padding: 10px 16px;
      border: 1px solid #aaaaaa;
      border-radius: 3px;
      background: #eeeeee;
      color: #111111;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #dddddd;
    }

    .wide-button {
      margin: 0 12px;
    }

    #textInput {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: 2px solid #888888;
      border-radius: 3px;
    }

    #typedText {
      min-height: 20px;
      overflow-wrap: anywhere;
    }

    body.dark-mode {
      background: #1e1e1e;
      color: #f5f5f5;
    }

    body.dark-mode .card {
      background: #2c2c2c;
      color: #f5f5f5;
      border-color: #555555;
    }

    body.dark-mode button {
      background: #444444;
      color: #ffffff;
      border-color: #777777;
    }

    body.dark-mode button:hover {
      background: #555555;
    }

    @media (max-width: 600px) {
      body {
        padding-top: 35px;
      }

      .container {
        flex-direction: column;
      }

      .wide-button {
        margin: 8px 0;
      }
    }
  </style>
</head>
<body>
  <h1>My Interactive Web Page</h1>

  <div class="container">
    <button class="wide-button" id="darkModeButton">Toggle Dark Mode</button>

    <section class="card">
      <h2>Click Counter</h2>
      <p id="counter">0</p>
      <button id="clickButton">Click Me</button>
    </section>

    <section class="card">
      <h2>Live Text Display</h2>
      <input id="textInput" type="text" placeholder="Type something...">
      <p>You typed:</p>
      <p id="typedText"></p>
    </section>

    <button class="wide-button" id="welcomeButton">Show Welcome Message</button>
  </div>

  <script>
    let count = 0;

    document.getElementById("clickButton").addEventListener("click", function () {
      count++;
      document.getElementById("counter").textContent = count;
    });

    document.getElementById("textInput").addEventListener("input", function () {
      document.getElementById("typedText").textContent = this.value;
    });

    document.getElementById("darkModeButton").addEventListener("click", function () {
      document.body.classList.toggle("dark-mode");
    });

    document.getElementById("welcomeButton").addEventListener("click", function () {
      alert("Welcome to my interactive web page!");
    });
  </script>
</body>
</html>
